<!-- navigationBar.html : JS fetch로 인클루드하는 공통 하단 탭바 -->
<style>
    .nav-bar {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 375px;
        background: #f8f8f8;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px 0 20px;
        z-index: 100;
    }

    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        position: relative;
        padding: 4px 16px;
        text-decoration: none;
    }

    .nav-item svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: #1a1a1a;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .nav-item.active svg {
        stroke: #1a1a1a;
    }

    /* 채팅 배지 */
    .nav-badge {
        position: absolute;
        top: 0px;
        right: 8px;
        background: #ff4444;
        color: white;
        font-size: 10px;
        font-weight: 700;
        min-width: 16px;
        height: 16px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-family: -apple-system, sans-serif;
    }

    /* 더보기 점 배지 */
    .nav-dot {
        position: absolute;
        top: 2px;
        right: 10px;
        width: 6px;
        height: 6px;
        background: #ff4444;
        border-radius: 50%;
    }
</style>

<nav class="nav-bar" id="nav-bar">
    <!-- Friends (active) -->
    <a class="nav-item active" href="03_roomSelection.html" data-page="friends">
        <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
        </svg>
    </a>

    <!-- Chats -->
    <a class="nav-item" href="#" data-page="chats">
        <svg viewBox="0 0 24 24">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span class="nav-badge">1</span>
    </a>

    <!-- Search -->
    <a class="nav-item" href="#" data-page="search">
        <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
    </a>

    <!-- More -->
    <a class="nav-item" href="#" data-page="more">
        <svg viewBox="0 0 24 24" stroke="none" fill="#1a1a1a">
            <circle cx="5" cy="12" r="1.5" />
            <circle cx="12" cy="12" r="1.5" />
            <circle cx="19" cy="12" r="1.5" />
        </svg>
        <span class="nav-dot"></span>
    </a>
</nav>

<script>
    // 현재 페이지에 맞게 active 탭 자동 설정
    (function () {
        const path = window.location.pathname.split('/').pop();
        const pageMap = {
            '03_roomSelection.html': 'friends',
            'navigationBar.html': 'friends',
        };
        const activePage = pageMap[path] || 'friends';
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.toggle('active', item.dataset.page === activePage);
        });
    })();
</script>
