<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>KakaoTalk - Friends</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
        }

        .phone-wrapper {
            width: 375px;
            min-height: 812px;
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        /* ── Status Bar ── */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .battery-icon {
            width: 22px;
            height: 11px;
            border: 1.5px solid #1a1a1a;
            border-radius: 2px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1.5px;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 5px;
            background: #1a1a1a;
            border-radius: 0 1px 1px 0;
        }

        .battery-fill {
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 1px;
        }

        /* ── Top Nav ── */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px 12px;
        }

        .top-nav h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .top-icons {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .top-icons svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #1a1a1a;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: pointer;
        }

        /* ── Notice Banner ── */
        .notice-banner {
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
        }

        .notice-banner .info-icon {
            width: 16px;
            height: 16px;
            border: 1.5px solid #888;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #888;
            font-weight: 700;
            flex-shrink: 0;
        }

        .notice-banner svg {
            width: 14px;
            height: 14px;
            stroke: #888;
            stroke-width: 2;
            fill: none;
        }

        /* ── My Profile ── */
        .my-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            overflow: hidden;
            background: #ddd;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* placeholder avatar (no real image) */
        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #c8a882, #a07850);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: 600;
        }

        .my-name {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* ── Section Header ── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px 10px;
        }

        .section-title {
            font-size: 13px;
            color: #aaa;
            font-weight: 400;
        }

        .section-chevron {
            width: 18px;
            height: 18px;
            stroke: #aaa;
            stroke-width: 2;
            fill: none;
            cursor: pointer;
        }

        /* ── Channel Item ── */
        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .channel-icon {
            width: 48px;
            height: 48px;
            background: #FFE000;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        /* KakaoTalk Channel speech bubble icon */
        .channel-icon svg {
            width: 30px;
            height: 30px;
        }

        .channel-name {
            flex: 1;
            font-size: 16px;
            font-weight: 400;
        }

        .channel-count {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 13px;
            color: #aaa;
        }

        .channel-count svg {
            width: 14px;
            height: 14px;
            stroke: #aaa;
            stroke-width: 2;
            fill: none;
        }

        /* ── Bottom padding for nav bar ── */
        .content-area {
            padding-bottom: 80px;
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                No Service
                <svg width="15" height="12" viewBox="0 0 15 12" fill="none">
                    <path
                        d="M7.5 2.5C9.8 2.5 11.9 3.5 13.3 5.1L14.5 3.8C12.7 1.9 10.2 0.7 7.5 0.7C4.8 0.7 2.3 1.9 0.5 3.8L1.7 5.1C3.1 3.5 5.2 2.5 7.5 2.5Z"
                        fill="#1a1a1a" />
                    <path
                        d="M7.5 5.3C9 5.3 10.3 5.9 11.3 6.9L12.5 5.6C11.1 4.3 9.4 3.5 7.5 3.5C5.6 3.5 3.9 4.3 2.5 5.6L3.7 6.9C4.7 5.9 6 5.3 7.5 5.3Z"
                        fill="#1a1a1a" />
                    <circle cx="7.5" cy="10" r="1.5" fill="#1a1a1a" />
                </svg>
            </div>
            <div style="font-size:16px;font-weight:500;">21:23</div>
            <div class="status-right">
                <span>🔒</span>
                <span>100%</span>
                <div class="battery-icon">
                    <div class="battery-fill"></div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <!-- Top Navigation -->
            <div class="top-nav">
                <h1>Friends</h1>
                <div class="top-icons">
                    <!-- Search -->
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <!-- Music note -->
                    <svg viewBox="0 0 24 24">
                        <path d="M9 18V5l12-2v13" />
                        <circle cx="6" cy="18" r="3" />
                        <circle cx="18" cy="16" r="3" />
                    </svg>
                    <!-- Settings -->
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </div>
            </div>

            <!-- Notice Banner -->
            <div class="notice-banner">
                <div class="info-icon">i</div>
                <span>Friends' Names Display</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </div>

            <!-- My Profile -->
            <div class="my-profile">
                <div class="avatar">
                    <div class="avatar-placeholder">N</div>
                </div>
                <span class="my-name"><a href="04_chatAlarm.html">Nicolas</a></span>
            </div>

            <!-- Channel Section -->
            <div class="section-header">
                <span class="section-title">Channel</span>
                <svg class="section-chevron" viewBox="0 0 24 24">
                    <polyline points="18 15 12 9 6 15" />
                </svg>
            </div>

            <!-- Channel Item -->
            <div class="channel-item">
                <div class="channel-icon">
                    <!-- KakaoTalk Channel bubble icon (Ch) -->
                    <svg viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="12" fill="#FFE000" />
                        <!-- Speech bubble -->
                        <path
                            d="M20 8C12.82 8 7 12.925 7 19c0 3.54 2.01 6.7 5.14 8.73-.18 1.68-.65 4.27-.74 4.72 0 0 4.4-2.48 6.2-3.5.43.05.86.05 1.4.05 7.18 0 13-4.925 13-11S27.18 8 20 8z"
                            fill="#1a1a1a" />
                        <text x="20" y="22" text-anchor="middle" fill="#FFE000" font-size="10" font-weight="700"
                            font-family="-apple-system, sans-serif">Ch</text>
                    </svg>
                </div>
                <span class="channel-name">Channel</span>
                <div class="channel-count">
                    2
                    <svg viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Navigation Bar (인클루드) -->
        <div id="nav-include"></div>
    </div>

    <script>
        // navigationBar.html 인클루드 
        fetch('navigationBar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-include').innerHTML = html;
            })
            .catch(() => {
                // fetch 실패 시 (file:// 프로토콜 등) 인라인 폴백
                console.warn('navigationBar.html fetch 실패 — 로컬 파일 실행 시 웹서버가 필요합니다.');
            });
    </script>
</body>

</html>
