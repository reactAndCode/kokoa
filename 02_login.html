<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>코코아톡 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Apple+SD+Gothic+Neo:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #aaaaaa;
            --border: #e0e0e0;
            --btn-bg: #f2f2f2;
            --btn-text: #1a1a1a;
            --kakao-yellow: #FEE500;
            --input-focus: #3a3a3a;
        }

        body {
            font-family: -apple-system, 'Apple SD Gothic Neo', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-wrapper {
            width: 375px;
            min-height: 812px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            padding: 0 24px;
            position: relative;
            overflow: hidden;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .battery {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .battery-icon {
            width: 22px;
            height: 11px;
            border: 1.5px solid #1a1a1a;
            border-radius: 2px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 1px;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 5px;
            background: #1a1a1a;
            border-radius: 0 1px 1px 0;
        }

        .battery-fill {
            width: 20%;
            height: 100%;
            background: #ff3b30;
            border-radius: 1px;
        }

        /* Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 80px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            font-size: 16px;
            color: var(--text-primary);
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
        }

        .input-group input:focus {
            border-bottom-color: var(--input-focus);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.85;
        }

        .btn-login {
            background: var(--btn-bg);
            color: var(--btn-text);
            margin-bottom: 10px;
        }

        .btn-signup {
            background: var(--btn-bg);
            color: var(--btn-text);
            margin-bottom: 20px;
        }

        .link-find {
            text-align: center;
            font-size: 13px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
        }

        .link-find:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="phone-wrapper">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                No Service
                <svg width="15" height="12" viewBox="0 0 15 12" fill="none">
                    <path
                        d="M7.5 2.5C9.8 2.5 11.9 3.5 13.3 5.1L14.5 3.8C12.7 1.9 10.2 0.7 7.5 0.7C4.8 0.7 2.3 1.9 0.5 3.8L1.7 5.1C3.1 3.5 5.2 2.5 7.5 2.5Z"
                        fill="#1a1a1a" />
                    <path
                        d="M7.5 5.3C9 5.3 10.3 5.9 11.3 6.9L12.5 5.6C11.1 4.3 9.4 3.5 7.5 3.5C5.6 3.5 3.9 4.3 2.5 5.6L3.7 6.9C4.7 5.9 6 5.3 7.5 5.3Z"
                        fill="#1a1a1a" />
                    <circle cx="7.5" cy="10" r="1.5" fill="#1a1a1a" />
                </svg>
            </div>
            <div style="font-size:16px; font-weight:500;">18:43</div>
            <div class="status-right">
                <span>🔒</span>
                <span>11%</span>
                <div class="battery">
                    <div class="battery-icon">
                        <div class="battery-fill"></div>
                    </div>
                    <span>⚡</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div class="header">
                <h1>Welcome to 코코아톡 </h1>
                <p>If you have a 코코아톡 Account,<br>log in with your email or phone number.</p>
            </div>

            <div class="form">
                <div class="input-group">
                    <input type="text" placeholder="Email or phone number" autocomplete="off">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" autocomplete="off">
                </div>
            </div>

            <button class="btn btn-login"><a href="03_roomSelection.html">Log In</a> </button>
            <button class="btn btn-signup">Sign Up</button>
            <span class="link-find">Find 코코아톡 Account or Password</span>
        </div>
    </div>
</body>

</html>
